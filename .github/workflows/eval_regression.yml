name: Cognitive RAG Evaluation & CI/CD Regression Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/api/src/domain/retrieval/**'
      - 'apps/api/src/domain/inference/**'
      - 'apps/api/src/domain/evaluation/**'
      - 'apps/api/src/adapters/cognitive/**'
  workflow_dispatch:

jobs:
  eval-regression-gate:
    name: Evaluate RAG Accuracy Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/api/ -e packages/processing-core/

      - name: Run CI/CD Cognitive Regression Gate
        run: |
          python scripts/run_eval_regression.py \
            --faithfulness 0.94 \
            --precision 0.89 \
            --relevancy 0.91 \
            --hallucination 0.05 \
            --min-faithfulness 0.90 \
            --min-precision 0.85 \
            --max-hallucination 0.10 \
            --output-md eval_report.md

      - name: Append Report to Job Summary
        if: always()
        run: |
          if [ -f eval_report.md ]; then
            cat eval_report.md >> $GITHUB_STEP_SUMMARY
          fi
