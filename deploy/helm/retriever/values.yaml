# Default values for retriever Helm Chart
global:
  imageRegistry: ""
  imagePullSecrets: []

api:
  replicaCount: 2
  image:
    repository: ghcr.io/prateeksharma/retriever-api
    pullPolicy: IfNotPresent
    tag: "v1.2.0-alpha1"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    ENVIRONMENT: production
    LOG_LEVEL: info
    PORT: "8000"
    EMBEDDING_PROVIDER: ollama
    OLLAMA_BASE_URL: http://localhost:11434/v1
    CORS_ORIGINS: "*"

web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/prateeksharma/retriever-web
    pullPolicy: IfNotPresent
    tag: "v1.2.0-alpha1"
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: rag.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: admin.rag.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: retriever-tls
      hosts:
        - rag.example.com
        - admin.rag.example.com

postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: "pg16"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  auth:
    database: retriever_db
    username: postgres
    password: "change-me-in-production"
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    enabled: true
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

migrations:
  runOnDeploy: true
  backoffLimit: 3

gpu:
  enabled: false
  type: "nvidia.com/gpu"
  count: 1
  nodeSelector:
    accelerator: nvidia
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
