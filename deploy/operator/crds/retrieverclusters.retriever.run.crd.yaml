apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: retrieverclusters.retriever.run
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: retriever.run
  names:
    kind: RetrieverCluster
    listKind: RetrieverClusterList
    plural: retrieverclusters
    singular: retrievercluster
    shortNames:
      - rc
      - rcluster
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
          description: Current lifecycle phase of the Retriever cluster
        - name: Desired
          type: integer
          jsonPath: .spec.replicas
          description: Number of desired API replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
          description: Number of healthy running API replicas
        - name: Version
          type: string
          jsonPath: .status.activeImageTag
          description: Active Retriever Docker image tag
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - replicas
              properties:
                name:
                  type: string
                  description: Optional cluster label
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 2
                  description: Number of FastAPI worker pods
                webReplicas:
                  type: integer
                  minimum: 0
                  maximum: 20
                  default: 1
                  description: Number of Next.js Web Studio pods
                imageTag:
                  type: string
                  default: "v1.2.0-alpha1"
                  description: Container image tag for Retriever components
                postgresPvcSize:
                  type: string
                  default: "20Gi"
                  description: Storage capacity for pgvector volume
                postgresStorageClass:
                  type: string
                  description: Optional Kubernetes storage class
                gpu:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    gpuType:
                      type: string
                      default: "nvidia.com/gpu"
                    gpuCount:
                      type: integer
                      default: 1
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string
                    tolerations:
                      type: array
                      items:
                        type: object
                backupPolicy:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    schedule:
                      type: string
                      default: "0 2 * * *"
                    retentionDays:
                      type: integer
                      default: 30
                    s3Bucket:
                      type: string
                    s3Prefix:
                      type: string
                      default: "cluster-backups"
                environmentVariables:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Running
                    - Degraded
                    - Upgrading
                    - Failed
                readyReplicas:
                  type: integer
                  default: 0
                desiredReplicas:
                  type: integer
                  default: 2
                webReadyReplicas:
                  type: integer
                  default: 0
                databaseHealthy:
                  type: boolean
                  default: false
                lastBackupAt:
                  type: string
                  format: date-time
                lastReconciledAt:
                  type: string
                  format: date-time
                activeImageTag:
                  type: string
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
