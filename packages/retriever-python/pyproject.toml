[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retriever-python"
version = "1.0.0"
description = "Official Python Client SDK for Retriever Enterprise Cognitive Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Prateek Sharma", email = "prateeqsharma@gmail.com" }
]
keywords = [
    "rag",
    "retriever",
    "vector-search",
    "colbert",
    "graphrag",
    "mcp",
    "swarm",
    "react-loop",
    "enterprise-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://rag.prateeq.in"
Documentation = "https://github.com/prat3010/retriever"
Repository = "https://github.com/prat3010/retriever"
